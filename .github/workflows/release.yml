name: Release

on:
  push:
    tags:
      # Bare semver tags — same convention as kimchi-workflows.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  # bun version pinned to match local dev (package.json engines/setup).
  BUN_VERSION: "1.4.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=10.8.1 sh -
          echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install & verify
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

  # macOS binaries are built on macOS runners so they can be re-signed:
  # bun --compile grafts the app payload onto a pre-signed runtime, which
  # invalidates the signature, and the kernel kills badly-signed arm64
  # binaries outright (SIGKILL, exit 137) — see oven-sh/bun#7208. darwin-x64
  # is cross-compiled from the arm64 runner (bun targets are host-agnostic;
  # codesign is not host-arch-sensitive).
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            bun-target: bun-darwin-arm64
            runner: macos-15
            os: darwin
          - platform: darwin-x64
            bun-target: bun-darwin-x64
            runner: macos-15
            os: darwin
          - platform: linux-x64
            bun-target: bun-linux-x64
            runner: ubuntu-latest
            os: linux
          - platform: linux-arm64
            bun-target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pnpm
        run: |
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=10.8.1 sh -
          echo "$HOME/.local/share/pnpm" >> "$GITHUB_PATH"

      - name: Install dependencies
        # Runtime deps only — bun bundles them into the compiled binary; the
        # toolchain (biome/tsc/vitest) ran in the checks job.
        run: pnpm install --frozen-lockfile --prod

      - name: Stamp version from tag
        # perl -pi -e is portable across BSD (macOS) and GNU sed semantics.
        run: perl -pi -e 's/0\.0\.0-dev/${{ github.ref_name }}/' src/version.ts

      # The codesign step parses entitlements with AMFI's strict XML
      # deserializer; plutil is lenient and cannot gate this. Python's
      # expat-backed plistlib is strict like AMFI and fails in seconds instead
      # of mid-build on the macOS runner.
      - name: Validate entitlements plist (strict XML)
        if: matrix.os == 'darwin'
        run: python3 -c "import plistlib; plistlib.load(open('build/entitlements.mac.plist', 'rb'))"

      # Imports the Developer ID cert into a throwaway keychain and exports
      # CSC_NAME for the signing step. No-ops when the secrets are absent —
      # the build then falls back to ad-hoc signing.
      - name: Set up Developer ID signing
        if: matrix.os == 'darwin'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/setup-codesign.sh

      - name: Compile binary
        run: >-
          bun build --compile --minify --target=${{ matrix.bun-target }} src/cli.ts
          --outfile dist-bin/kimchictl-${{ matrix.platform }}

      - name: Sign binary (macOS)
        if: matrix.os == 'darwin'
        run: bash scripts/codesign.sh dist-bin/kimchictl-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: kimchictl-${{ matrix.platform }}
          path: dist-bin/kimchictl-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      sha_darwin_arm64: ${{ steps.shas.outputs.sha_darwin_arm64 }}
      sha_darwin_x64: ${{ steps.shas.outputs.sha_darwin_x64 }}
      sha_linux_arm64: ${{ steps.shas.outputs.sha_linux_arm64 }}
      sha_linux_x64: ${{ steps.shas.outputs.sha_linux_x64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: Assemble release files
        run: |
          (cd dist-bin && sha256sum kimchictl-* > checksums.txt)
          # Ship the installer with the release: the documented install URL
          # points at the release asset, not the branch, so it always matches
          # the binaries it downloads.
          cp scripts/install.sh dist-bin/install.sh
          ls -la dist-bin/

      - name: Capture asset checksums
        id: shas
        run: |
          cd dist-bin
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            key="sha_${platform//-/_}"
            echo "${key}=$(sha256sum "kimchictl-${platform}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true

  npm:
    needs: publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: "Guard: npm token configured"
        id: token_guard
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not configured — skipping npm publish. Add the org secret to enable it."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.token_guard.outputs.has_token == 'true'
        run: |
          npm pkg set version="${{ github.ref_name }}"
          sed -i 's/0\.0\.0-dev/${{ github.ref_name }}/' src/version.ts
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          npm publish --access public

  homebrew-tap:
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: "Guard: tap token configured"
        id: token_guard
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_GITHUB_TOKEN secret is not configured — skipping Homebrew tap bump. Configure a PAT/GitHub App token with write access to getkimchi/homebrew-tap."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.token_guard.outputs.has_token == 'true'
      - name: Render formula
        if: steps.token_guard.outputs.has_token == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          SHA_DARWIN_ARM64: ${{ needs.publish.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ needs.publish.outputs.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ needs.publish.outputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ needs.publish.outputs.sha_linux_x64 }}
        run: |
          sed \
            -e "s/@VERSION@/${VERSION}/" \
            -e "s/@SHA_DARWIN_ARM64@/${SHA_DARWIN_ARM64}/" \
            -e "s/@SHA_DARWIN_X64@/${SHA_DARWIN_X64}/" \
            -e "s/@SHA_LINUX_ARM64@/${SHA_LINUX_ARM64}/" \
            -e "s/@SHA_LINUX_X64@/${SHA_LINUX_X64}/" \
            scripts/homebrew/kimchictl.rb > Formula.tmp
          if grep -q '@[A-Z_]*@' Formula.tmp; then
            echo "::error::unreplaced placeholders remain in formula"; exit 1
          fi
          mv Formula.tmp Formula.out
      - name: Push formula to getkimchi/homebrew-tap
        if: steps.token_guard.outputs.has_token == 'true'
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/getkimchi/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv Formula.out tap/Formula/kimchictl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kimchictl.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${{ github.ref_name }} — nothing to do."
          else
            git commit -m "kimchictl ${{ github.ref_name }}"
            git push
