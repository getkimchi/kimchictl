name: Release

on:
  push:
    tags:
      # Bare semver tags — same convention as kimchi-workflows.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  # bun version pinned to match local dev (package.json engines/setup).
  BUN_VERSION: "1.4.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install & verify
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

  # macOS binaries are built on macOS runners so they can be re-signed:
  # bun --compile grafts the app payload onto a pre-signed runtime, which
  # invalidates the signature, and the kernel kills badly-signed arm64
  # binaries outright (SIGKILL, exit 137) — see oven-sh/bun#7208. darwin-x64
  # is cross-compiled from the arm64 runner (bun targets are host-agnostic;
  # codesign is not host-arch-sensitive).
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            bun-target: bun-darwin-arm64
            runner: macos-15
            os: darwin
          - platform: darwin-x64
            bun-target: bun-darwin-x64
            runner: macos-15
            os: darwin
          - platform: linux-x64
            bun-target: bun-linux-x64
            runner: ubuntu-latest
            os: linux
          - platform: linux-arm64
            bun-target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The standalone pnpm installer puts pnpm in a per-OS home
      # (~/.local/share/pnpm vs ~/Library/pnpm) — action-setup handles both.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Install dependencies
        # Runtime deps only — bun bundles them into the compiled binary; the
        # toolchain (biome/tsc/vitest) ran in the checks job.
        run: pnpm install --frozen-lockfile --prod

      - name: Stamp version from tag
        # perl -pi -e is portable across BSD (macOS) and GNU sed semantics.
        run: perl -pi -e 's/0\.0\.0-dev/${{ github.ref_name }}/' src/version.ts

      # The codesign step parses entitlements with AMFI's strict XML
      # deserializer; plutil is lenient and cannot gate this. Python's
      # expat-backed plistlib is strict like AMFI and fails in seconds instead
      # of mid-build on the macOS runner.
      - name: Validate entitlements plist (strict XML)
        if: matrix.os == 'darwin'
        run: python3 -c "import plistlib; plistlib.load(open('build/entitlements.mac.plist', 'rb'))"

      # Imports the Developer ID cert into a throwaway keychain and exports
      # CSC_NAME for the signing step. No-ops when the secrets are absent —
      # the build then falls back to ad-hoc signing.
      - name: Set up Developer ID signing
        if: matrix.os == 'darwin'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: bash scripts/setup-codesign.sh

      - name: Compile binary
        run: >-
          bun build --compile --minify --target=${{ matrix.bun-target }} src/cli.ts
          --outfile dist-bin/kimchictl-${{ matrix.platform }}

      - name: Sign binary (macOS)
        if: matrix.os == 'darwin'
        run: bash scripts/codesign.sh dist-bin/kimchictl-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: kimchictl-${{ matrix.platform }}
          path: dist-bin/kimchictl-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      sha_darwin_arm64: ${{ steps.shas.outputs.sha_darwin_arm64 }}
      sha_darwin_x64: ${{ steps.shas.outputs.sha_darwin_x64 }}
      sha_linux_arm64: ${{ steps.shas.outputs.sha_linux_arm64 }}
      sha_linux_x64: ${{ steps.shas.outputs.sha_linux_x64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: Assemble release files
        run: |
          (cd dist-bin && sha256sum kimchictl-* > checksums.txt)
          # Ship the installer with the release: the documented install URL
          # points at the release asset, not the branch, so it always matches
          # the binaries it downloads.
          cp scripts/install.sh dist-bin/install.sh
          ls -la dist-bin/

      - name: Capture asset checksums
        id: shas
        run: |
          cd dist-bin
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            key="sha_${platform//-/_}"
            echo "${key}=$(sha256sum "kimchictl-${platform}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true

  # Tokenless npm publish via trusted publishing (OIDC) — same model as
  # kimchi-workflows. The trusted publisher is registered per-package on
  # npmjs.com (getkimchi/kimchictl, workflow release.yml, npm publish); no
  # secrets to create or rotate.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never use the package-manager cache in release builds.
          package-manager-cache: false

      - name: Publish npm package
        run: |
          npm pkg set version="${{ github.ref_name }}"
          sed -i 's/0\.0\.0-dev/${{ github.ref_name }}/' src/version.ts
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          npm publish --access public

  # Pushes Formula/kimchictl.rb to getkimchi/homebrew-tap via a write-enabled
  # deploy key (HOMEBREW_TAP_SSH_KEY) — same mechanism as the kimchi harness
  # release workflow, scoped to the tap repo only (no PAT).
  homebrew-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: "Guard: tap deploy key configured"
        id: key_guard
        env:
          TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          if [ -z "${TAP_SSH_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_SSH_KEY secret is not configured — skipping Homebrew tap bump. Store the private half of a write-enabled deploy key on getkimchi/homebrew-tap."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key_guard.outputs.has_key == 'true'
      - name: Checkout homebrew-tap
        if: steps.key_guard.outputs.has_key == 'true'
        uses: actions/checkout@v6
        with:
          repository: getkimchi/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          path: homebrew-tap
      - name: Update Formula/kimchictl.rb
        if: steps.key_guard.outputs.has_key == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          SHA_DARWIN_ARM64: ${{ needs.publish.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ needs.publish.outputs.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ needs.publish.outputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ needs.publish.outputs.sha_linux_x64 }}
        run: |
          sed \
            -e "s/@VERSION@/${VERSION}/" \
            -e "s/@SHA_DARWIN_ARM64@/${SHA_DARWIN_ARM64}/" \
            -e "s/@SHA_DARWIN_X64@/${SHA_DARWIN_X64}/" \
            -e "s/@SHA_LINUX_ARM64@/${SHA_LINUX_ARM64}/" \
            -e "s/@SHA_LINUX_X64@/${SHA_LINUX_X64}/" \
            scripts/homebrew/kimchictl.rb > homebrew-tap/Formula/kimchictl.rb
          if grep -q '@[A-Z_]*@' homebrew-tap/Formula/kimchictl.rb; then
            echo "::error::unreplaced placeholders remain in formula"; exit 1
          fi
      - name: Commit and push
        if: steps.key_guard.outputs.has_key == 'true'
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kimchictl.rb
          if git diff --staged --quiet; then
            echo "Formula already at ${{ github.ref_name }} — nothing to do."
          else
            git commit -m "kimchictl ${{ github.ref_name }}"
            git push
          fi
